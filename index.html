    <title>Voice Identification App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- LEFT INFO PANEL -->
        <div class="info-panel">
            <h2 class="animate-title">VOICE ID</h2>

            <p class="subtitle animate-subtitle">Introduction</p>

            <p class="description animate-text">
                Welcome to the Voice Identification system. Record voice samples for users
                and identify them quickly. Press <strong>Record</strong> to begin training
                and <strong>Identify</strong> to recognize a voice.
            </p>
        </div>

        <!-- MAIN CARD -->
        <div class="container">
            <h1>Voice Identification<br>System</h1>

            <button class="record" onclick="recordPerson(1)">
                🎤 Record Person 1
            </button>

            <button class="record" onclick="recordPerson(2)">
                🎤 Record Person 2
            </button>

            <button class="identify" onclick="identifyVoice()">
                🔍 Identify Voice
            </button>

            <div class="status-box">
                <p id="status">Status: Idle</p>
            </div>
        </div>
